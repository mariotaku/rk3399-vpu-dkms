PACKAGE_NAME="rk3399-vpu"
PACKAGE_VERSION="#MODULE_VERSION#"

# The module keeps the stock name so that it replaces the in-tree
# hantro-vpu; depmod prefers modules under updates/.
BUILT_MODULE_NAME[0]="hantro-vpu"
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# The driver source is Debian's 6.12 hantro-vpu; it only fits 6.12 kernels.
BUILD_EXCLUSIVE_KERNEL="^6\.12\."
BUILD_EXCLUSIVE_ARCH="aarch64"
AUTOINSTALL="yes"
